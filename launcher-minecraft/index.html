<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kurai Launcher v0.0.1-beta.2</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111116; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 1. BARRA SUPERIOR (NAVBAR PRINCIPAL MODERNIZADA) */
        .navbar { 
            height: 60px; 
            background: rgba(20, 20, 27, 0.75); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 30px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            z-index: 10; 
        }
        .navbar h2 { 
            margin: 0; 
            font-size: 16px; 
            color: #ffffff; 
            font-weight: 800;
            letter-spacing: 2px; 
            background: linear-gradient(45deg, #7289da, #5865f2); 
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links { 
            display: flex; 
            gap: 12px; 
        }
        
        /* BOTONES PRINCIPALES */
        .nav-btn { 
            padding: 10px 20px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            color: #99aab5; 
            font-size: 13px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn:hover { 
            background: rgba(114, 137, 218, 0.1); 
            border-color: rgba(114, 137, 218, 0.3);
            color: #ffffff; 
            transform: translateY(-1px);
        }
        .nav-btn.active { 
            background: #5865f2; 
            border-color: #5865f2;
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        /* 2. SUBMENÚ DE NAVEGACIÓN WEB */
        .sub-navbar { 
            height: 48px; 
            background: #14141c; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.03); 
            z-index: 9; 
        }
        
        /* BOTONES DE LAS PÁGINAS */
        .sub-btn { 
            padding: 6px 18px; 
            background: transparent; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #8e9297; 
            font-size: 12px; 
            cursor: pointer; 
            border-radius: 20px; 
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .sub-btn:hover { 
            border-color: #7289da; 
            color: #ffffff; 
            background: rgba(255, 255, 255, 0.02);
        }
        .sub-btn.active { 
            background: #ffffff; 
            color: #111116; 
            border-color: #ffffff; 
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15); 
        }

        /* CONTENEDOR CENTRAL */
        .center-container { flex: 1; position: relative; background: #1a1a22; }
        
        /* PÁGINA WEB INCRUSTADA */
        .news-webview { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 1; }

        /* VENTANAS MODALES SUPERPUESTAS */
        .overlay-tab { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 17, 22, 0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 5; }
        .overlay-tab.active { display: flex; }
        .card { background: #23232c; padding: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 480px; }

        /* BARRA INFERIOR DE JUEGO */
        .play-bar { height: 100px; background: linear-gradient(to top, rgba(17,17,22,1) 0%, rgba(20,20,27,0.95) 100%); border-top: 1px solid #252530; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 10; box-shadow: 0 -5px 20px rgba(0,0,0,0.4); }
        .play-bar-section { display: flex; gap: 20px; align-items: center; }
        
        .selector-box { display: flex; flex-direction: column; min-width: 180px; }
        .selector-box label { font-size: 11px; text-transform: uppercase; color: #7289da; font-weight: bold; margin-bottom: 5px; letter-spacing: 0.5px; }
        select, input[type="text"] { padding: 10px; background: #252533; border: 1px solid #3e3e56; color: white; border-radius: 5px; font-size: 13px; }
        select:focus, input:focus { border-color: #5865f2; outline: none; }

        /* BOTÓN JUGAR */
        .btn-launch { width: 220px; height: 55px; background: #3ba55d; color: white; border: none; border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(59,165,93,0.3); letter-spacing: 1px; }
        .btn-launch:hover { background: #2f854a; transform: translateY(-2px); }
        .btn-launch:active { transform: translateY(0); }

        .btn-action { padding: 10px; background: #3e3e56; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-action:hover { background: #4e4e6c; }
        .btn-danger { background: #ed4245; }
        .btn-danger:hover { background: #c03537; }
        .btn-primary { background: #5865f2; width: 100%; margin-top: 10px; }

        #status { font-size: 12px; color: #faa61a; text-align: right; font-weight: bold; max-width: 250px; }
        .flex-row { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>KURAI LAUNCHER</h2>
        <div class="nav-links">
            <button class="nav-btn active" id="main-btn-home" onclick="switchTab('home')">🎮 Inicio</button>
            <button class="nav-btn" onclick="switchTab('tab-cuentas')">👤 Cuentas</button>
            <button class="nav-btn" onclick="switchTab('tab-opciones')">⚙️ Opciones</button>
        </div>
    </div>

    <div class="sub-navbar" id="webSubmenu">
        <button class="sub-btn active" onclick="changeWebpage(this, 'https://suzukurai.github.io/KuraiLauncher/devlog')">Actualizaciones</button>
        <button class="sub-btn" onclick="changeWebpage(this, 'https://www.minecraft.net/es-es')">Minecraft Oficial</button>
    </div>

    <div class="center-container">
        
        <webview id="newsWebview" class="news-webview" src="https://suzukurai.github.io/KuraiLauncher/devlog"></webview>

        <div id="tab-cuentas" class="overlay-tab">
            <div class="card">
                <h3 style="margin-top:0; color:#7289da;">Gestión de Cuentas Offline</h3>
                <div class="form-group flex-row" style="align-items: stretch;">
                    <select id="manageAccountsSelect" style="flex:1;"></select>
                    <button class="btn-action btn-danger" id="deleteAccountBtn">Eliminar</button>
                </div>
                <hr style="border-color: #333; margin: 20px 0;">
                <h3 style="font-size:16px;">Añadir Nuevo Usuario</h3>
                <input type="text" id="newUsername" placeholder="Ej: Steve" style="width:100%; box-sizing:border-box;">
                <button class="btn-action btn-primary" id="addAccountBtn">Agregar Usuario</button>
                <button class="btn-action" onclick="switchTab('home')" style="width:100%; margin-top:8px; background:#252533;">Volver</button>
            </div>
        </div>

        <div id="tab-opciones" class="overlay-tab">
            <div class="card">
                <h3 style="margin-top:0; color:#7289da;">Ajustes de Rendimiento Global</h3>
                <div style="margin-bottom:15px;">
                    <label>Asignación de RAM Máxima (Ej: 4G, 6G):</label>
                    <input type="text" id="maxRamInput" style="width:100%; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:15px;">
                    <label>Asignación de RAM Mínima (Ej: 1G, 2G):</label>
                    <input type="text" id="minRamInput" style="width:100%; box-sizing:border-box;">
                </div>

                <h3 style="font-size:16px; margin-top:20px; color:#7289da;">Filtros de Versiones</h3>
                <div style="margin-bottom:10px; display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="enableSnapshots" style="width:18px; height:18px; cursor:pointer;">
                    <label for="enableSnapshots" style="cursor:pointer; font-size:13px;">Habilitar Snapshots (Versiones de prueba)</label>
                </div>
                <div style="margin-bottom:10px; display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="enableBetas" style="width:18px; height:18px; cursor:pointer;">
                    <label for="enableBetas" style="cursor:pointer; font-size:13px;">Habilitar Betas/Alphas Antiguas</label>
                </div>

                <h3 style="font-size:16px; margin-top:20px; color:#7289da;">Desarrollo</h3>
                <div style="margin-bottom:20px; display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="showConsoleInput" style="width:18px; height:18px; cursor:pointer;">
                    <label for="showConsoleInput" style="cursor:pointer; font-size:13px; color:#ffb6c1; font-weight:600;">Mostrar Consola de Logs en tiempo real</label>
                </div>

                <button class="btn-action btn-primary" id="saveSettingsBtn">Guardar Ajustes</button>
                <button class="btn-action" onclick="switchTab('home')" style="width:100%; margin-top:8px; background:#252533;">Volver</button>
            </div>
        </div>

        <div id="tab-editar-perfil" class="overlay-tab">
            <div class="card" style="max-width: 520px;">
                <h3 style="margin-top:0; color:#7289da;">Configuración Avanzada del Perfil</h3>
                
                <div style="margin-bottom:15px;">
                    <label style="font-size:12px; font-weight:bold;">Nombre del Perfil:</label>
                    <input type="text" id="editProfileName" style="width:100%; box-sizing:border-box; margin-top:5px;">
                </div>

                <div class="flex-row" style="margin-bottom:15px;">
                    <div style="flex:1;">
                        <label style="font-size:12px; font-weight:bold;">RAM Dedicada (Ej: 4G):</label>
                        <input type="text" id="editProfileRam" placeholder="Dejar vacío para usar global" style="width:100%; box-sizing:border-box; margin-top:5px;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:12px; font-weight:bold;">Versión de Minecraft:</label>
                        <select id="editProfileVersion" style="width:100%; margin-top:5px; padding:10px;"></select>
                    </div>
                </div>

                <div style="margin-bottom:25px;">
                    <label style="font-size:12px; font-weight:bold;">Ruta de Instalación (.minecraft):</label>
                    <div class="flex-row" style="margin-top:5px;">
                        <input type="text" id="editProfilePath" readonly placeholder="Predeterminada (%appdata%/.minecraft)" style="flex:1; background:#1e1e26; color:#aaa; font-size:12px;">
                        <button class="btn-action" onclick="selectCustomFolder()" style="font-size:12px; background:#5865f2;">Examinar</button>
                    </div>
                    <p style="font-size:11px; color:#7289da; margin: 5px 0 0 0; cursor:pointer; text-decoration:underline;" onclick="resetProfilePath()">Restablecer a ruta por defecto (%appdata%)</p>
                </div>

                <div class="flex-row">
                    <button class="btn-action btn-primary" onclick="saveProfileAdvanced()" style="flex:1;">Guardar Cambios</button>
                    <button class="btn-action" onclick="switchTab('home')" style="background:#252533; width:100px;">Cancelar</button>
                </div>
            </div>
        </div>

    </div>

    <div id="launcherConsole" style="display: none; height: 180px; background: #08080c; border-top: 2px solid #22222c; font-family: 'Consolas', monospace; font-size: 12px; color: #4af626; padding: 12px; overflow-y: auto; box-sizing: border-box;">
        <div style="color: #666; border-bottom: 1px solid #222; padding-bottom: 4px; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px;">=== CONSOLA DE LOGS EN VIVO (MCLC OUTPUT) ===</div>
        <div id="consoleOutputs"></div>
    </div>

    <div class="play-bar">
        <div class="play-bar-section">
            <div class="selector-box">
                <label>Perfil de Versión</label>
                <div class="flex-row">
                    <select id="profileSelect" style="min-width:160px;"></select>
                    <button class="btn-action" onclick="openEditProfile()" style="background:#252533; border:1px solid #3e3e56; padding: 5px 12px;" title="Configurar este perfil">⚙️</button>
                    <button class="btn-action btn-danger" id="deleteProfileBtn" title="Eliminar Perfil" style="padding: 5px 12px;">X</button>
                </div>
            </div>
            
            <div class="selector-box">
                <label>Cuenta Activa</label>
                <select id="accountSelect"></select>
            </div>

            <div class="selector-box" style="border-left: 1px solid #333; padding-left: 20px;">
                <label>Nuevo Perfil Rápido</label>
                <div class="flex-row">
                    <input type="text" id="profileName" placeholder="Nombre" style="width:110px; padding:7px;">
                    <select id="profileVersion" style="padding:7px;"></select>
                    <button class="btn-action" id="saveProfileBtn" style="background:#5865f2; padding: 5px 12px;">+</button>
                </div>
            </div>
        </div>

        <div class="play-bar-section">
            <div id="status">Cargando launcher...</div>
            <button class="btn-launch" id="launchBtn">¡JUGAR!</button>
        </div>
    </div>

<script>
    const { ipcRenderer } = require('electron');
    const webview = document.getElementById('newsWebview');
    const webSubmenu = document.getElementById('webSubmenu');

    let profileBeingEdited = null;

    // 🔥 LOS ARRAYS AHORA SE RELLENAN EXCLUSIVAMENTE CON LA API DINÁMICA DE MOJANG
    let VERSIONES_ESTABLES = [];
    let VERSIONES_SNAPSHOTS = [];
    let VERSIONES_BETAS = [];

    // 🔥 LOGICA PARA DESCARGAR EL LISTADO OFICIAL DESDE EL PROCESO MAIN
    async function cargarVersionesDesdeAPI() {
        try {
            document.getElementById('status').innerText = "Buscando nuevas versiones de Minecraft...";
            const mcVersions = await ipcRenderer.invoke('get-mojang-versions');
            
            VERSIONES_ESTABLES = [];
            VERSIONES_SNAPSHOTS = [];
            VERSIONES_BETAS = [];

            mcVersions.forEach(v => {
                if (v.type === 'release') {
                    VERSIONES_ESTABLES.push(v.id);
                } else if (v.type === 'snapshot') {
                    VERSIONES_SNAPSHOTS.push(v.id);
                } else if (v.type === 'old_beta' || v.type === 'old_alpha') {
                    VERSIONES_BETAS.push(v.id);
                }
            });
            document.getElementById('status').innerText = "Versiones sincronizadas.";
        } catch (error) {
            console.error("Fallo de red al obtener manifiesto, usando offline...", error);
            VERSIONES_ESTABLES = ["1.21.1", "1.21", "1.20.4", "1.19.4", "1.16.5", "1.12.2", "1.8.9", "1.7.10"];
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.overlay-tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        
        if(tabId === 'home') {
            document.getElementById('main-btn-home').classList.add('active');
            webSubmenu.style.display = 'flex'; 
        } else {
            document.getElementById(tabId).classList.add('active');
            if (window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.add('active');
            }
            webSubmenu.style.display = 'none'; 
        }
    }

    function changeWebpage(buttonElement, url) {
        document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
        buttonElement.classList.add('active');
        
        if (webview) {
            webview.setAttribute('src', url);
            webview.loadURL(url).catch(err => console.log("Cargando WebView..."));
        }
    }

    function updateVersionSelect() {
        const versionSelect = document.getElementById('profileVersion');
        if(!versionSelect) return;
        
        versionSelect.innerHTML = ''; 

        VERSIONES_ESTABLES.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v; 
            opt.innerText = `Release: ${v}`;
            versionSelect.appendChild(opt);
        });

        if (document.getElementById('enableSnapshots').checked) {
            VERSIONES_SNAPSHOTS.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; 
                opt.innerText = `Snapshot: ${v}`;
                versionSelect.appendChild(opt);
            });
        }

        if (document.getElementById('enableBetas').checked) {
            VERSIONES_BETAS.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; 
                opt.innerText = `Beta/Alpha: ${v}`;
                versionSelect.appendChild(opt);
            });
        }
    }

    async function openEditProfile() {
        const profileId = document.getElementById('profileSelect').value;
        if(!profileId) return alert("Por favor, selecciona o crea un perfil primero.");
        
        const data = await ipcRenderer.invoke('get-profiles');
        const targetProfile = data.list.find(p => p.id === profileId);
        
        if(targetProfile) {
            profileBeingEdited = targetProfile.id;
            document.getElementById('editProfileName').value = targetProfile.name || "";
            document.getElementById('editProfileRam').value = targetProfile.ram || "";
            document.getElementById('editProfilePath').value = targetProfile.path || "";
            
            const editVersionSelect = document.getElementById('editProfileVersion');
            editVersionSelect.innerHTML = '';

            VERSIONES_ESTABLES.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; 
                opt.innerText = `Release: ${v}`;
                editVersionSelect.appendChild(opt);
            });

            if (data.settings && data.settings.enableSnapshots) {
                VERSIONES_SNAPSHOTS.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v; 
                    opt.innerText = `Snapshot: ${v}`;
                    editVersionSelect.appendChild(opt);
                });
            }

            if (data.settings && data.settings.enableBetas) {
                VERSIONES_BETAS.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v; 
                    opt.innerText = `Beta/Alpha: ${v}`;
                    editVersionSelect.appendChild(opt);
                });
            }

            const versionExists = Array.from(editVersionSelect.options).some(opt => opt.value === targetProfile.version);
            if (!versionExists && targetProfile.version) {
                const opt = document.createElement('option');
                opt.value = targetProfile.version;
                opt.innerText = `${targetProfile.version} (Actual del perfil)`;
                editVersionSelect.appendChild(opt);
            }

            editVersionSelect.value = targetProfile.version;
            switchTab('tab-editar-perfil');
        }
    }

    async function selectCustomFolder() {
        const selectedPath = await ipcRenderer.invoke('select-folder');
        if(selectedPath) {
            document.getElementById('editProfilePath').value = selectedPath;
        }
    }

    function resetProfilePath() {
        document.getElementById('editProfilePath').value = "";
    }

    function saveProfileAdvanced() {
        const name = document.getElementById('editProfileName').value.trim();
        if(!name) return alert("El perfil debe tener un nombre.");

        const advancedData = {
            id: profileBeingEdited,
            name: name,
            version: document.getElementById('editProfileVersion').value,
            ram: document.getElementById('editProfileRam').value.trim(),
            path: document.getElementById('editProfilePath').value.trim()
        };

        ipcRenderer.send('update-profile-advanced', advancedData);
        switchTab('home');
    }

    // --- FLUJO DE INICIALIZACIÓN SECUENCIAL ---
    window.addEventListener('DOMContentLoaded', async () => {
        if(webview) {
            webview.addEventListener('dom-ready', () => {
                console.log('Navegador interno Kurai listo.');
            });
        }
        
        // 1. Primero descargamos de internet el manifiesto dinámico de Mojang
        await cargarVersionesDesdeAPI();
        
        // 2. Cargamos el almacenamiento local de perfiles y cuentas
        const data = await ipcRenderer.invoke('get-profiles');
        renderAll(data);
    });

    function renderAll(data) {
        const profileSelect = document.getElementById('profileSelect');
        profileSelect.innerHTML = '';
        if (data.list.length === 0) {
            profileSelect.innerHTML = '<option value="">Crea un perfil -> </option>';
        } else {
            let selectedExist = false;
            data.list.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id; opt.innerText = `${p.name} (${p.version})`;
                if (data.selectedProfile === p.id) { opt.selected = true; selectedExist = true; }
                profileSelect.appendChild(opt);
            });
            if (!selectedExist && data.list.length > 0) ipcRenderer.send('select-profile', data.list[0].id);
        }

        const accountSelect = document.getElementById('accountSelect');
        const manageAccountsSelect = document.getElementById('manageAccountsSelect');
        accountSelect.innerHTML = '';
        manageAccountsSelect.innerHTML = '';

        if (data.accounts.length === 0) {
            accountSelect.innerHTML = '<option value="">Sin cuentas</option>';
            manageAccountsSelect.innerHTML = '<option value="">No hay cuentas registradas</option>';
            document.getElementById('status').innerText = "Crea una cuenta en el menú superior.";
        } else {
            let accExist = false;
            data.accounts.forEach(acc => {
                const opt1 = document.createElement('option'); opt1.value = acc; opt1.innerText = acc;
                const opt2 = document.createElement('option'); opt2.value = acc; opt2.innerText = acc;
                
                if (data.selectedAccount === acc) { opt1.selected = true; opt2.selected = true; accExist = true; }
                accountSelect.appendChild(opt1);
                manageAccountsSelect.appendChild(opt2);
            });
            if (!accExist && data.accounts.length > 0) ipcRenderer.send('select-account', data.accounts[0]);
            else if (data.list.length > 0) document.getElementById('status').innerText = "Listo para la acción.";
        }

        document.getElementById('maxRamInput').value = data.settings.maxMemory || "4G";
        document.getElementById('minRamInput').value = data.settings.minMemory || "2G";
        
        document.getElementById('enableSnapshots').checked = data.settings.enableSnapshots || false;
        document.getElementById('enableBetas').checked = data.settings.enableBetas || false;

        const consolePanel = document.getElementById('launcherConsole');
        if (data.settings && data.settings.showConsole) {
            consolePanel.style.display = 'block';
            document.getElementById('showConsoleInput').checked = true;
        } else {
            consolePanel.style.display = 'none';
            document.getElementById('showConsoleInput').checked = false;
        }

        updateVersionSelect();
    }

    document.getElementById('saveProfileBtn').addEventListener('click', () => {
        const name = document.getElementById('profileName').value.trim();
        if(!name) return alert("Ponle un nombre al perfil");
        ipcRenderer.send('save-profile', { id: 'id_' + Date.now(), name, version: document.getElementById('profileVersion').value, ram: "", path: "" });
        document.getElementById('profileName').value = '';
    });

    document.getElementById('profileSelect').addEventListener('change', (e) => ipcRenderer.send('select-profile', e.target.value));
    document.getElementById('deleteProfileBtn').addEventListener('click', () => ipcRenderer.send('delete-profile', document.getElementById('profileSelect').value));

    document.getElementById('addAccountBtn').addEventListener('click', () => {
        const username = document.getElementById('newUsername').value.trim();
        if(!username) return alert("Escribe un usuario");
        ipcRenderer.send('save-account', username);
        document.getElementById('newUsername').value = '';
        switchTab('home');
    });

    document.getElementById('accountSelect').addEventListener('change', (e) => ipcRenderer.send('select-account', e.target.value));
    document.getElementById('deleteAccountBtn').addEventListener('click', () => ipcRenderer.send('delete-account', document.getElementById('manageAccountsSelect').value));

    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
        ipcRenderer.send('save-settings', { 
            maxMemory: document.getElementById('maxRamInput').value, 
            minMemory: document.getElementById('minRamInput').value,
            enableSnapshots: document.getElementById('enableSnapshots').checked,
            enableBetas: document.getElementById('enableBetas').checked,
            showConsole: document.getElementById('showConsoleInput').checked 
        });
        updateVersionSelect();
        switchTab('home');
    });

    document.getElementById('launchBtn').addEventListener('click', () => ipcRenderer.send('launch-game'));

    ipcRenderer.on('data-updated', (event, data) => renderAll(data));
    ipcRenderer.on('status-msg', (event, msg) => document.getElementById('status').innerText = msg);
    ipcRenderer.on('progress', (event, data) => {
        document.getElementById('status').innerText = `Progreso: ${data.task} (${data.type})`;
    });

    ipcRenderer.on('console-log', (event, text) => {
        const container = document.getElementById('consoleOutputs');
        if (!container) return;
        
        const line = document.createElement('div');
        line.style.marginBottom = '3px';
        line.style.lineHeight = '18px';
        line.style.whiteSpace = 'pre-wrap';
        
        if (text.includes('[ERROR]')) {
            line.style.color = '#ff4a4a';
        } else if (text.includes('[DEBUG]')) {
            line.style.color = '#7289da';
        } else {
            line.style.color = '#e0e0e0';
        }

        line.innerText = text;
        container.appendChild(line);

        const panel = document.getElementById('launcherConsole');
        panel.scrollTop = panel.scrollHeight;
    });
</script>
</body>
</html>
