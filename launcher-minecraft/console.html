<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consola de Salida - Historial de Ticks</title>
    <style>
        body {
            background-color: #0a0a0f;
            color: #d8d8e6;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            margin: 0;
            padding: 15px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .console-header {
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4a4a5e;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        #console-feed {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #console-feed::-webkit-scrollbar { width: 5px; }
        #console-feed::-webkit-scrollbar-thumb { background: #1a1a26; border-radius: 4px; }
        
        .tick-line { white-space: pre-wrap; line-height: 18px; word-break: break-all; }
        .tick-line.error { color: #ff4a4a; font-weight: bold; }
        .tick-line.debug { color: #7289da; }
        .tick-line.info { color: #e0e0e0; }
    </style>
</head>
<body>

    <div class="console-header">
    Consola (Live)
    <button id="copy-btn" style="float:right; cursor:pointer; background:#252533; border:none; color:#a5a5b5; padding:2px 8px; border-radius:4px; font-size:10px;">Copiar Log</button>
</div>
    <div id="console-feed"></div>

    <script>
        const { ipcRenderer } = require('electron');
        const feedContainer = document.getElementById('console-feed');

        // Escucha asíncrona de los flujos del juego enviada por ticks del proceso Main
        ipcRenderer.on('console-tick-log', (event, log) => {
            const line = document.createElement('div');
            line.className = `tick-line ${log.level}`;
            line.innerText = log.text;
            
            feedContainer.appendChild(line);

            // Fuerza el scroll automático inmediato al fondo en cada tick
            feedContainer.scrollTop = feedContainer.scrollHeight;
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const text = Array.from(document.querySelectorAll('.tick-line'))
                            .map(el => el.innerText).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = "¡Copiado!";
                setTimeout(() => btn.innerText = "Copiar Log", 2000);
            });
        });
    </script>
</body>
</html>
